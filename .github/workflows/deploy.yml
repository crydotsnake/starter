name: Deploy to GitHub Pages

# Deploys the website at https://the-swan-foundation.github.io/starter/ and the documentation
# (the-swan-foundation/the-swan-starter-docs, pages from the docs/ folder of the monorepo) under /starter/docs/.

on:
  push:
    branches: [main]
  # Sent by the documentation repository and by the monorepo when the documentation changes.
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout the documentation website
        uses: actions/checkout@v7
        with:
          repository: the-swan-foundation/the-swan-starter-docs
          path: .docs-site
      - name: Checkout the documentation pages
        uses: actions/checkout@v7
        with:
          repository: the-swan-foundation/the-swan-starter
          path: .monorepo
          sparse-checkout: docs
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .docs-site/package-lock.json
      - name: Build the website
        run: |
          npm ci
          npm run build
      - name: Build the documentation
        working-directory: .docs-site
        run: |
          npm ci
          npm run build
        env:
          DOCS_DIR: ${{ github.workspace }}/.monorepo/docs
          ASTRO_BASE: /starter/docs/
      - name: Add the documentation to the website
        run: |
          test ! -e dist/docs
          cp -R .docs-site/dist dist/docs
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
